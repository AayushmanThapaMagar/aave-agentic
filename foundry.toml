[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fuzz.runs = 512
invariant.runs = 128
invariant.depth = 64

remappings = [
  "aave-v4/=lib/aave-v4/",
  "src/=lib/aave-v4/src/",
  "aave-position-guardian/=src/",
  "forge-std/=lib/forge-std/src/"
]
